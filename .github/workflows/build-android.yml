name: Build Android APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    if: contains(github.event.head_commit.message, '[debug]') || contains(github.event.head_commit.message, '[release]')

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v5

      - name: Настройка Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "npm"

      - name: Настройка Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Настройка и кэширование Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Установка зависимостей
        run: npm ci

      # - name: Генерация нативного кода Expo
      #   run: npx expo prebuild --platform android --no-install

      - name: Кэширование C++ / NDK артефактов
        uses: actions/cache@v6
        with:
          path: |
            android/app/.cxx
            android/.cxx
            node_modules/**/android/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Определение параметров сборки
        run: |
          MSG="${{ github.event.head_commit.message }}"

          if [[ "$MSG" == *"[release]"* ]]; then
            TYPE="release"
            TASK="assembleRelease"
          else
            TYPE="debug"
            TASK="assembleDebug"
          fi

          echo "BUILD_TYPE=$TYPE" >> $GITHUB_ENV
          echo "TASK=$TASK" >> $GITHUB_ENV

      - name: Настройка подписи Debug-ключом для Release
        if: ${{ env.BUILD_TYPE == 'release' }}
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle

      - name: Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew ${{ env.TASK }} -PreactNativeArchitectures=arm64-v8a

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ env.BUILD_TYPE }}.apk
          path: android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/app-${{ env.BUILD_TYPE }}.apk
          archive: false
