name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v5

      - name: Настройка Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: 'npm'

      - name: Настройка Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настройка и кэширование Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Установка зависимостей
        run: npm ci

      # - name: Генерация нативного кода Expo
      #   run: npx expo prebuild --platform android --no-install

      - name: Кэширование C++ / NDK артефактов
        uses: actions/cache@v6
        with:
          path: |
            android/app/.cxx
            android/.cxx
            node_modules/**/android/.cxx
          key: ${{ runner.os }}-ndk-${{ hashFiles('**/CMakeLists.txt', '**/*.cpp', '**/*.h', '**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false